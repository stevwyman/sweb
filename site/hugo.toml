baseURL = "http://localhost:3000/"
title = "sweb"
locale = "en-US"
defaultContentLanguage = "en"
enableRobotsTXT = true
enableEmoji = true
enableGitInfo = false

[pagination]
pagerSize = 10

[taxonomies]
tag = "tags"
category = "categories"

[permalinks]
blog = "/blog/:slug/"

[imaging]
resampleFilter = "CatmullRom"

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
style = "tango"
noClasses = false
guessSyntax = true

[outputs]
home = ["HTML", "RSS"]
section = ["HTML", "RSS"]

[module]
proxy = "direct"
[module.hugoVersion]
extended = true
min = "0.160.1"
[[module.imports]]
path = "github.com/google/docsy/theme"
disable = false

[params]
offlineSearch = false
prism_syntax_highlighting = false
description = "Documentation site generated by Hugo with the Docsy theme, gated by Auth.js JWT sessions."

[params.ui]
breadcrumb_disable = false
navbar_logo = true
navbar_translucent_over_cover_disable = false
sidebar_menu_compact = true
sidebar_search_disable = true
showLightDarkModeMenu = true
footer_about_enable = false

[params.ui.feedback]
enable = false

[params.ui.readingtime]
enable = false

[params.copyright]
authors = "sweb"
from_year = 2026

[[menu.main]]
name = "Documentation"
url = "/docs/"
weight = 10

[[menu.main]]
name = "Blog"
url = "/blog/"
weight = 20

[[menu.main]]
name = "Members"
url = "/members/"
weight = 30

[[menu.main]]
name = "Login"
url = "/login"
weight = 40
