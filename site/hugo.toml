baseURL = "http://localhost:3000/"
title = "sweb"
languageCode = "en"
defaultContentLanguage = "en"
enableRobotsTXT = true
enableEmoji = true
enableGitInfo = false

[pagination]
pagerSize = 10

[taxonomies]
tag = "tags"
category = "categories"
series = "series"

[markup.highlight]
guessSyntax = true
lineNos = true
noClasses = false
lineNumbersInTable = false

[module]
[[module.imports]]
path = "github.com/razonyang/hugo-theme-bootstrap"

[build]
writeStats = true

[[menus.main]]
name = "Posts"
url = "/posts/"
weight = 1

[[menus.main]]
name = "Members"
url = "/members/"
weight = 2

[[menus.main]]
name = "Login"
url = "/login"
weight = 3
